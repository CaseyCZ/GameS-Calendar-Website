name: Enrich game metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 1'
  push:
    paths:
      - 'fetch-games.js'

permissions:
  contents: write

concurrency:
  group: enrich-game-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enrich games.json
        env:
          METADATA_CONCURRENCY: 5
          METADATA_RETRY_DAYS: 30
        run: npm run fetch-games

      - name: Check JavaScript
        run: npm run check

      - name: Commit changed data
        run: |
          if git diff --quiet -- games.json; then
            echo "games.json is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore: enrich game metadata"
          git pull --rebase origin main
          git push origin HEAD:main
