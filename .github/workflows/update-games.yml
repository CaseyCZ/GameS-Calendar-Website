name: Update game data from RAWG

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1,4'

permissions:
  contents: write

concurrency:
  group: update-rawg-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Check RAWG API key
        id: rawg
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          if [ -n "$RAWG_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "RAWG_API_KEY is not configured; keeping the current games.json."
          fi

      - name: Refresh games.json
        if: steps.rawg.outputs.has_key == 'true'
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GAMES_MONTHS_PAST: 6
          GAMES_MONTHS_FUTURE: 18
          RAWG_DETAIL_CONCURRENCY: 4
        run: npm run fetch-games

      - name: Commit changed data
        if: steps.rawg.outputs.has_key == 'true'
        run: |
          if git diff --quiet -- games.json; then
            echo "games.json is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore: refresh RAWG game data"
          git push