name: Enrich game metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 1'
  push:
    branches:
      - main
    paths:
      - 'fetch-games.js'
      - 'enrich-public-metadata.js'
      - 'games-api/scripts/enrich-catalog-igdb.js'
      - 'package.json'
      - '.github/workflows/update-games.yml'

permissions:
  contents: write

concurrency:
  group: enrich-game-metadata
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enrich games.json
        env:
          METADATA_CONCURRENCY: 8
          METADATA_RETRY_DAYS: 30
          STEAM_CONCURRENCY: 2
          STEAM_RETRY_DAYS: 14
        run: npm run fetch-games

      - name: Improve descriptions and subscription catalogs
        run: npm run enrich-public

      - name: Enrich catalog from IGDB
        if: ${{ env.IGDB_CLIENT_ID != '' && env.IGDB_CLIENT_SECRET != '' }}
        env:
          IGDB_ENRICH_CONCURRENCY: 4
          IGDB_ENRICH_RETRY_DAYS: 30
        run: npm run enrich-igdb

      - name: Check JavaScript
        run: npm run check

      - name: Commit changed data
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- games.json; then
            echo "games.json is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore: enrich game metadata"
          git pull --rebase origin main
          git push origin HEAD:main
