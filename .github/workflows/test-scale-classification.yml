name: Test scale classification

on:
  push:
    branches:
      - test/scale-classification
    paths:
      - 'test-scale-classification.js'
      - '.github/workflows/test-scale-classification.yml'

permissions:
  contents: write

concurrency:
  group: test-scale-classification
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test/scale-classification

      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.GAMES_DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY_B64" ]]; then
            echo "::error::Missing GAMES_DEPLOY_SSH_KEY_B64"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/games-deploy
          chmod 600 ~/.ssh/games-deploy
          ssh-keygen -y -f ~/.ssh/games-deploy >/dev/null
          ssh-keyscan -T 10 -p 22 130.61.49.108 > /tmp/games-host-keys 2>/dev/null
          test -s /tmp/games-host-keys
          if ! ssh-keygen -lf /tmp/games-host-keys | awk '{print $2}' | grep -Fxq 'SHA256:SHoVgKDg5pnIiJP70GQCO90OZTECuaNlKnfLK/WZF5Y'; then
            echo "::error::Oracle SSH host key fingerprint mismatch"
            exit 1
          fi
          ssh-keyscan -T 10 -p 22 -H 130.61.49.108 >> ~/.ssh/known_hosts

      - name: Run dry run on GameS server
        run: |
          set -euo pipefail
          remote_script="/home/ubuntu/games-calendar/repo/.scale-classification-test-${GITHUB_RUN_ID}.js"
          remote_report="/tmp/scale-classification-report-${GITHUB_RUN_ID}.json"

          base64 -w0 test-scale-classification.js | ssh -i ~/.ssh/games-deploy -o BatchMode=yes ubuntu@130.61.49.108 \
            "base64 -d > '$remote_script'"

          ssh -i ~/.ssh/games-deploy -o BatchMode=yes ubuntu@130.61.49.108 \
            "cd /home/ubuntu/games-calendar/repo && node --env-file=games-api/.env '$remote_script' > '$remote_report'; rc=\$?; rm -f '$remote_script'; exit \$rc"

          ssh -i ~/.ssh/games-deploy -o BatchMode=yes ubuntu@130.61.49.108 \
            "printf '__REPORT_BEGIN__\\n'; base64 -w0 '$remote_report'; printf '\\n__REPORT_END__\\n'; rm -f '$remote_report'" \
            > /tmp/scale-report-transfer.txt

          awk '/__REPORT_BEGIN__/{flag=1;next}/__REPORT_END__/{flag=0}flag' /tmp/scale-report-transfer.txt \
            | tr -d '\r\n' | base64 -d > scale-classification-report.json

          node -e "JSON.parse(require('fs').readFileSync('scale-classification-report.json','utf8')); console.log('report JSON OK')"

      - name: Print summary
        run: cat scale-classification-report.json

      - name: Save report to test branch
        run: |
          if [[ -z "$(git status --porcelain -- scale-classification-report.json)" ]]; then
            echo "report unchanged"
            exit 0
          fi
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add scale-classification-report.json
          git commit -m "test: update scale classification report"
          git push origin HEAD:test/scale-classification
