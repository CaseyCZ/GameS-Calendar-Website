name: Test scale classification

on:
  push:
    branches:
      - test/scale-classification
    paths:
      - 'test-scale-classification-live.js'
      - 'apply-scale-content-type-gate.js'
      - 'audit-scale-candidates.js'
      - 'audit-scale-game-types.js'
      - '.github/workflows/test-scale-classification.yml'

permissions:
  contents: write

concurrency:
  group: test-scale-classification
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test/scale-classification

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check audit syntax
        run: |
          node --check test-scale-classification-live.js
          node --check apply-scale-content-type-gate.js
          node --check audit-scale-candidates.js
          node --check audit-scale-game-types.js

      - name: Build full-candidate dry-run script
        run: |
          cp test-scale-classification-live.js test-scale-classification-live-all.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test-scale-classification-live-all.js')
          text = p.read_text()
          old_limit = 'function samples(rows, scale, limit = 30) {'
          new_limit = 'function samples(rows, scale, limit = 500) {'
          if old_limit not in text:
              raise SystemExit('samples() default limit marker not found')
          text = text.replace(old_limit, new_limit, 1)

          old_fields = "      score:row.after.score, hypes:row.after.hypes || 0, reasons:row.after.reasons,\n      companies:"
          new_fields = "      score:row.after.score, hypes:row.after.hypes || 0, reasons:row.after.reasons,\n      gameType:row.signal?.gameType || row.signal?.rawHints?.gameType || null,\n      companies:"
          if old_fields not in text:
              raise SystemExit('sample field marker not found')
          text = text.replace(old_fields, new_fields, 1)
          p.write_text(text)
          PY

      - name: Run rich classification dry run through deployed GameS API
        run: |
          node test-scale-classification-live-all.js > scale-classification-report.json
          rm -f test-scale-classification-live-all.js

      - name: Apply content type gate before scale audit
        run: node apply-scale-content-type-gate.js

      - name: Audit all AAA and small-title candidates
        run: |
          node audit-scale-candidates.js
          node audit-scale-game-types.js

      - name: Print audit summary
        run: |
          node - <<'NODE'
          const r = require('./scale-classification-report.json');
          const a = require('./scale-classification-audit.json');
          console.log(JSON.stringify({
            liveApiSignals:r.liveApiSignals,
            upcoming:r.scopes.upcoming,
            contentTypeGate:r.contentTypeGate,
            auditComplete:a.complete,
            audited:a.auditedCandidateCounts,
            statusCounts:a.statusCounts,
            flagged:a.flagged
          }, null, 2));
          NODE

      - name: Save reports to test branch
        run: |
          if [[ -z "$(git status --porcelain -- scale-classification-report.json scale-classification-audit.json)" ]]; then
            echo "reports unchanged"
            exit 0
          fi
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add scale-classification-report.json scale-classification-audit.json
          git commit -m "test: audit scale candidates after content type gate"
          git pull --rebase origin test/scale-classification
          git push origin HEAD:test/scale-classification
