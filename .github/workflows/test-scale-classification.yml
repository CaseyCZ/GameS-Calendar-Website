name: Test scale classification

on:
  push:
    branches:
      - test/scale-classification
    paths:
      - 'test-scale-classification-live.js'
      - '.github/workflows/test-scale-classification.yml'

permissions:
  contents: write

concurrency:
  group: test-scale-classification
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test/scale-classification

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check dry-run syntax
        run: node --check test-scale-classification-live.js

      - name: Run rich classification dry run through deployed GameS API
        run: node test-scale-classification-live.js > scale-classification-report.json

      - name: Print summary
        run: |
          node - <<'NODE'
          const r = require('./scale-classification-report.json');
          console.log(JSON.stringify({ liveApiSignals:r.liveApiSignals, upcoming:r.scopes.upcoming, samples:{ AAA:r.upcomingSamples.AAA.slice(0,10), small:r.upcomingSamples['Menší titul'].slice(0,10) } }, null, 2));
          NODE

      - name: Save report to test branch
        run: |
          git pull --rebase origin test/scale-classification
          if [[ -z "$(git status --porcelain -- scale-classification-report.json)" ]]; then
            echo "report unchanged"
            exit 0
          fi
          git config user.name "CaseyCZ"
          git config user.email "25530709+CaseyCZ@users.noreply.github.com"
          git add scale-classification-report.json
          git commit -m "test: update rich scale classification report"
          git push origin HEAD:test/scale-classification
