name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate JavaScript
        run: npm run check

      - name: Build compact catalog
        run: npm run build-index

      - name: Run regression tests
        run: npm test

      - name: Audit catalog quality
        run: npm run audit-data

      - name: Report compact catalog size
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const full = fs.statSync('games.json').size;
          const compact = fs.statSync('games-index.json').size;
          const saved = Math.round((1 - compact / full) * 100);
          console.log(`games.json: ${Math.round(full/1024)} KiB`);
          console.log(`games-index.json: ${Math.round(compact/1024)} KiB`);
          console.log(`payload reduction: ${saved}%`);
          const fullPayload = JSON.parse(fs.readFileSync('games.json', 'utf8'));
          const compactPayload = JSON.parse(fs.readFileSync('games-index.json', 'utf8'));
          if (!compactPayload.compact || !compactPayload.sparse) {
            console.error('Compact catalog must use the sparse web schema.');
            process.exit(1);
          }
          if ((compactPayload.games || []).length !== (fullPayload.games || []).length) {
            console.error('Compact catalog game count does not match the full catalog.');
            process.exit(1);
          }
          if (compact > 3.2 * 1024 * 1024) {
            console.error('Compact catalog exceeded the 3.2 MiB performance budget.');
            process.exit(1);
          }
          NODE
