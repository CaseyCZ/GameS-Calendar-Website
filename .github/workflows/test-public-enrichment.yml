name: Test public game enrichment

on:
  push:
    paths:
      - '.github/workflows/test-public-enrichment.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect NHL 27 Wikidata fields
        shell: bash
        run: |
          node <<'NODE'
          const qid = 'Q140695791';
          const base = 'https://www.wikidata.org/w/api.php';
          const ua = {'User-Agent':'GameS-Calendar/2.0 (https://caseycz.github.io/GameS-Calendar-Website/)'};
          const u = new URL(base);
          for (const [k,v] of Object.entries({action:'wbgetentities',ids:qid,props:'labels|descriptions|claims|sitelinks',languages:'cs|en',languagefallback:'1',format:'json',origin:'*'})) u.searchParams.set(k,v);
          const entity = (await (await fetch(u,{headers:ua})).json()).entities[qid];
          const ids = [];
          for (const prop of ['P136','P178','P123','P400']) {
            const values = (entity.claims?.[prop] || []).map(c => c.mainsnak?.datavalue?.value?.id).filter(Boolean);
            console.log(prop, values);
            ids.push(...values);
          }
          console.log('P856', (entity.claims?.P856 || []).map(c => c.mainsnak?.datavalue?.value).filter(Boolean));
          console.log('P1733', (entity.claims?.P1733 || []).map(c => c.mainsnak?.datavalue?.value).filter(Boolean));
          console.log('DESC', entity.descriptions);
          console.log('SITELINKS', {cswiki:entity.sitelinks?.cswiki?.title,enwiki:entity.sitelinks?.enwiki?.title});
          if (ids.length) {
            const l = new URL(base);
            for (const [k,v] of Object.entries({action:'wbgetentities',ids:[...new Set(ids)].join('|'),props:'labels',languages:'cs|en',languagefallback:'1',format:'json',origin:'*'})) l.searchParams.set(k,v);
            const labels = (await (await fetch(l,{headers:ua})).json()).entities;
            console.log('LABELS', Object.fromEntries(Object.entries(labels).map(([id,e])=>[id,e.labels?.cs?.value||e.labels?.en?.value||''])));
          }
          NODE
