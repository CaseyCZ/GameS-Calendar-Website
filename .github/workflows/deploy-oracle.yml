name: Deploy to Oracle Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'js/**'
      - 'games.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'CaseyCZ.png'
      - 'games-api/**'
      - '.github/workflows/deploy-oracle.yml'

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ secrets.ORACLE_HOST != '' && secrets.ORACLE_USER != '' && secrets.ORACLE_SSH_KEY != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_SSH_PORT }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_oracle
          chmod 600 ~/.ssh/id_oracle
          ssh-keyscan -p "$PORT" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy web and API through existing PM2 stack
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_oracle "$ORACLE_USER@$ORACLE_HOST" <<'REMOTE'
            set -euo pipefail
            test "$(id -un)" = "ubuntu"
            git -C /home/ubuntu/games-calendar/repo fetch origin main
            git -C /home/ubuntu/games-calendar/repo checkout main
            git -C /home/ubuntu/games-calendar/repo reset --hard origin/main
            chmod +x /home/ubuntu/games-calendar/repo/games-api/deploy/stremio-server-update.sh
            /home/ubuntu/games-calendar/repo/games-api/deploy/stremio-server-update.sh
          REMOTE

      - name: Verify public GameS health endpoint
        env:
          PUBLIC_URL: ${{ secrets.ORACLE_PUBLIC_URL }}
        if: ${{ env.PUBLIC_URL != '' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "${PUBLIC_URL%/}/games-health"
