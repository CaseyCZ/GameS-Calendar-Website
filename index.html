<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100719">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Rychlý herní kalendář a vyhledávač nových her napříč platformami.">
  <title>Herní Kalendář</title>
  <link rel="icon" href="CaseyCZ.png">
  <link rel="apple-touch-icon" href="CaseyCZ.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="detail-polish.css">
</head>
<body>
  <a class="skip-link" href="#games">Přejít na hry</a>

  <header class="topbar">
    <div class="topbar__row shell">
      <a class="brand" href="./" aria-label="Herní Kalendář – domů">
        <img class="brand__logo" src="CaseyCZ.png" alt="" width="42" height="42">
        <span class="brand__copy">
          <strong>Herní Kalendář</strong>
          <small>Herní vydání napříč platformami</small>
        </span>
      </a>

      <div class="topbar__stats" aria-label="Souhrn">
        <button class="stat-pill" type="button" data-stat-jump="visible" title="Zobrazit aktuální výběr">
          <strong id="stat-visible">0</strong><span>ve výběru</span>
        </button>
        <button class="stat-pill" type="button" data-stat-jump="30" title="Příštích 30 dní">
          <strong id="stat-30">0</strong><span>30 dní</span>
        </button>
        <button class="stat-pill" type="button" data-stat-jump="next" title="Příští měsíc">
          <strong id="stat-next">0</strong><span>příští měsíc</span>
        </button>
        <button class="stat-pill stat-pill--watch" type="button" id="watchlist-toggle" title="Zobrazit sledované hry">
          <strong id="stat-watchlist">0</strong><span>sledované</span>
        </button>
      </div>

      <div class="topbar__actions">
        <button class="icon-btn" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-popover" title="Hledat">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <span class="sr-only">Hledat</span>
        </button>
        <button class="icon-btn" id="share-button" type="button" title="Sdílet aktuální filtry">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V3m0 0 4 4m-4-4L8 7M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          <span class="sr-only">Sdílet</span>
        </button>
        <button class="primary-btn" id="calendar-all" type="button" title="Stáhnout aktuální výběr jako .ics">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Přidat výběr</span>
        </button>
      </div>
    </div>

    <div class="search-popover shell" id="search-popover" hidden>
      <label class="search-field" for="search-input">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="search-input" type="search" inputmode="search" autocomplete="off" placeholder="Hledat podle názvu hry…">
        <kbd>/</kbd>
      </label>
    </div>

    <div class="filters-wrap">
      <div class="filters shell" aria-label="Filtry her">
        <div class="platforms" id="platform-filters" aria-label="Platformy"></div>

        <select class="control" id="genre-filter" aria-label="Žánr">
          <option value="">Všechny žánry</option>
        </select>

        <select class="control" id="status-filter" aria-label="Stav vydání">
          <option value="upcoming">Nadcházející</option>
          <option value="released">Již vydané</option>
          <option value="all">Všechny</option>
        </select>

        <div class="period-control" aria-label="Období">
          <button class="chip" type="button" data-period="month">Tento měsíc</button>
          <button class="chip" type="button" data-period="next">Příští měsíc</button>
          <button class="chip" type="button" data-period="all">Vše</button>
          <button class="icon-btn icon-btn--small" type="button" id="prev-month" title="Předchozí měsíc" aria-label="Předchozí měsíc" hidden>‹</button>
          <select class="control control--month" id="month-filter" aria-label="Měsíc" hidden></select>
          <select class="control control--year" id="year-filter" aria-label="Rok" hidden></select>
          <button class="icon-btn icon-btn--small" type="button" id="next-month" title="Další měsíc" aria-label="Další měsíc" hidden>›</button>
        </div>

        <select class="control" id="sort-filter" aria-label="Řazení">
          <option value="date-asc">Nejdřív vydané</option>
          <option value="date-desc">Nejpozději vydané</option>
          <option value="rating-desc">Nejlépe hodnocené</option>
          <option value="name-asc">Název A–Z</option>
        </select>

        <button class="chip chip--reset" id="reset-filters" type="button">Reset</button>
      </div>
    </div>
  </header>

  <main class="shell main" id="main">
    <section class="hero-strip" aria-label="Informace o výběru">
      <div>
        <p class="eyebrow">Aktuální výběr</p>
        <h1 id="range-title">Načítám herní vydání…</h1>
        <p id="result-summary" class="muted" aria-live="polite">Připravuji data.</p>
      </div>
      <div class="view-toggle" role="group" aria-label="Zobrazení">
        <button class="icon-btn icon-btn--small is-active" type="button" data-view="grid" title="Mřížka" aria-label="Mřížka">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
        </button>
        <button class="icon-btn icon-btn--small" type="button" data-view="compact" title="Kompaktní" aria-label="Kompaktní">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h4v4H4zm7 0h9M4 14h4v4H4zm7 0h9"/></svg>
        </button>
      </div>
    </section>

    <section class="month-rail" id="month-rail" aria-label="Rychlý výběr měsíce"></section>

    <section class="skeleton-grid" id="skeleton-grid" aria-label="Načítání her">
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </section>

    <section id="games" class="games-grid" aria-label="Hry" hidden></section>

    <div class="load-more-wrap" id="load-more-wrap" hidden>
      <button class="secondary-btn" id="load-more" type="button">Načíst další</button>
    </div>

    <section class="empty-state" id="empty-state" hidden>
      <div class="empty-state__icon">🎮</div>
      <h2>Nic jsme nenašli</h2>
      <p>Zkus jinou platformu, období nebo název hry.</p>
      <button class="secondary-btn" type="button" id="empty-reset">Zrušit filtry</button>
    </section>
  </main>

  <footer class="shell" style="padding:0 0 28px;color:var(--muted);font-size:11px">
    Žánry a doplňující informace čerpají z <a href="https://www.wikidata.org/" target="_blank" rel="noopener noreferrer" style="color:var(--pink)">Wikidata</a> a <a href="https://cs.wikipedia.org/" target="_blank" rel="noopener noreferrer" style="color:var(--pink)">Wikipedie</a>.
  </footer>

  <dialog class="game-dialog" id="game-dialog">
    <button class="dialog-close icon-btn" id="dialog-close" type="button" aria-label="Zavřít">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <dialog class="trailer-dialog" id="trailer-dialog">
    <button class="dialog-close icon-btn" id="trailer-close" type="button" aria-label="Zavřít">×</button>
    <div class="video-frame" id="trailer-frame"></div>
  </dialog>

  <div class="toast-region" id="toast-region" style="pointer-events:auto" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Tato stránka potřebuje JavaScript pro vyhledávání a filtrování her.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
