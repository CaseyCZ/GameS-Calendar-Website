<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herní Kalendář - IGDB Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #0d0614;
            --bg-card: rgba(255, 255, 255, 0.02);
            --bg-card-hover: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-main: #f3f0f7;
            --text-muted: #9b91a8;
            --accent-pink: #ff479b;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #10b981;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.1) 0%, rgba(255, 71, 155, 0.05) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 1rem;
            margin-bottom: 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--accent-pink);
        }

        .brand h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-all-top {
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 100%);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(255, 71, 155, 0.3);
        }

        .add-all-top:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 71, 155, 0.5);
        }

        .view-modes {
            display: flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .view-mode-btn {
            padding: 0.4rem 0.8rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .view-mode-btn.active {
            background: rgba(255, 71, 155, 0.2);
            color: var(--accent-pink);
        }

        .view-mode-btn:hover {
            color: var(--accent-pink);
        }

        .lang-btn {
            background: rgba(255, 71, 155, 0.1);
            color: var(--accent-pink);
            border: 1px solid rgba(255, 71, 155, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: rgba(255, 71, 155, 0.2);
            border-color: rgba(255, 71, 155, 0.5);
        }

        .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-pink);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* FILTERS & CONTROLS */
        .controls {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
        }

        .filter-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .filter-row:last-child {
            margin-bottom: 0;
        }

        .filter-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 100px;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--accent-pink);
            background: rgba(255, 71, 155, 0.1);
        }

        .filter-btn.active {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
            color: white;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #160d24;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 3px rgba(255, 71, 155, 0.1);
        }

        .sort-select {
            padding: 0.7rem 1rem;
            background: #160d24;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--accent-pink);
        }

        /* CONTAINER - rozšířeno na celou šířku */
.main-container {
    max-width: 100%;
    margin: 0 auto;
    padding: 0 1.5rem 2rem;
}

.content-wrapper {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 2rem;
}

@media (max-width: 1024px) {
    .content-wrapper {
        grid-template-columns: 1fr;
    }
}

        .platform-icon {
    width: 16px;
    height: 16px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 4px;
}
        /* GAMES GRID */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .games-grid.compact {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.75rem;
        }

        .games-grid.list {
            grid-template-columns: 1fr;
        }

        .game-card.list-view {
            flex-direction: row;
            gap: 1rem;
            height: auto;
        }
/* Výchozí skrytí tlačítek pro všechny typy karet */
.game-card .card-actions {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}

/* Zobrazení tlačítek po najetí na konkrétní kartu */
.game-card:hover .card-actions {
    opacity: 1;
    visibility: visible;
}
        .game-card.list-view .game-cover {
            width: 120px;
            height: 150px;
            min-width: 120px;
            aspect-ratio: auto;
        }

        .game-card.list-view .game-info {
            flex: 1;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
            cursor: pointer;
        }

        .game-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-pink);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(255, 71, 155, 0.15);
        }

        .game-cover {
            width: 100%;
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #160d24, #1a0e28);
            position: relative;
            overflow: hidden;
        }
        /* Specificky pro tlačítka ikon (Srdce, Kalendář) */
.card-actions .action-btn:not(:first-child) {
    flex: 0 0 auto; /* Pevná velikost pro ikonková tlačítka */
    padding: 0.5rem; 
}
.card-actions {
    display: flex;
    flex-wrap: wrap;     /* Povolí zalamování tlačítek na další řádek, pokud se nevejdou */
    gap: 0.4rem;         /* Mezery mezi tlačítky */
    margin-top: 1rem;    /* Odsazení od textu nad tlačítky */
    width: 100%;         /* Zajistí, že kontejner bere celou šířku game-info */
}
        .game-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-cover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            padding: 1rem;
            gap: 0.5rem;
        }

        .game-card:hover .game-cover-overlay {
            opacity: 1;
        }

        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.8rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--accent-blue);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .game-info {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-main);
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
/* Základní stav karty v mřížce - skryté info */
.game-card.grid-hover-card {
    position: relative;
    overflow: hidden;
}
/* Hlavní kontejner pro hry v režimu seznamu - 3 sloupce vedle sebe */
#container.list-view-active, 
#container {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.game-card.grid-hover-card .grid-overlay-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(18, 18, 18, 0.92); /* Tmavé poloprůhledné pozadí přes obálku */
    backdrop-filter: blur(4px);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transform: translateY(100%); /* Schová se pod spodní okraj karty */
    transition: transform 0.3s ease-in-out;
    z-index: 2;
}

/* Po najetí myší na kartu v mřížce vyskočí informace nahoru */
.game-card.grid-hover-card:hover .grid-overlay-info {
    transform: translateY(0);
}
        .release-date {
            background: rgba(255, 71, 155, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            color: var(--accent-pink);
            font-weight: 600;
        }

        .platforms-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .platform-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.6rem;
            background: rgba(192, 132, 252, 0.1);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--accent-purple);
            border: 1px solid rgba(192, 132, 252, 0.2);
        }

        .card-actions {
            display: flex;
            gap: 0.3rem;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 0.5rem;
        }

        .game-card.list-view .card-actions {
            border-top: none;
            padding-top: 0;
        }

        .action-btn {
    box-sizing: border-box; /* Důležité: padding se připočítává dovnitř šířky */
    /* Základní styly pro všechna tlačítka a odkazy v akcích */
    padding: 0.5rem 1rem; 
    text-align: center;
    text-decoration: none;
    border: 1px solid transparent; /* nebo jiný rámeček, pokud používáte */
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0; /* Tlačítka se nesmí zmenšovat pod svou velikost */
    
    /* Zajištění, aby ikonová tlačítka nebyla příliš malá */
    min-height: 36px;
    min-width: 36px; 
}

        .action-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .fav-btn {
            font-size: 1.2rem;
        }

        /* SIDEBAR */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .month-stats {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .month-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: rgba(192, 132, 252, 0.05);
            border-radius: 6px;
            border-left: 3px solid var(--accent-purple);
        }

        .month-stat-name {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .month-stat-count {
            font-weight: 700;
            color: var(--accent-pink);
            font-size: 1.2rem;
        }

        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .favorite-item {
            padding: 0.8rem;
            background: rgba(16, 185, 129, 0.05);
            border-radius: 6px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .favorite-item:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        .favorite-remove {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .favorite-remove:hover {
            color: var(--accent-pink);
        }

        /* EMPTY STATE */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 71, 155, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 71, 155, 0.5);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-bottom {
                flex-direction: column;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .filter-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-label {
                min-width: auto;
            }
        }

/* Kompaktní horní lišta – navazuje na původní vzhled */
body { line-height: 1.5; }
.header {
    padding: 12px 20px;
    margin-bottom: 10px;
}
.header-content { max-width: none; }
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 0;
}
.brand { gap: 10px; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand h1 { font-size: 1.45rem; line-height: 1.2; }
.brand .subtitle { font-size: 11px; margin-top: 2px; }
.header-actions { gap: 7px; }
.stats { gap: 20px; margin-left: auto; }
.stat { min-width: 84px; gap: 2px; text-align: center; }
.stat-value { font-size: 1.4rem; line-height: 1.15; }
.stat-label { font-size: 10px; }
.add-all-top { padding: 8px 13px; font-size: 13px; }
.view-modes { gap: 2px; padding: 3px; }
.view-mode-btn { padding: 6px 9px; }
.lang-btn { padding: 7px 10px; }
.header .share-btn {
    background: rgba(255,255,255,.04);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 7px 10px;
}
.header .share-btn:hover { border-color: var(--accent-pink); }

.controls {
    max-width: none;
    margin: 0 20px 10px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
}
.controls-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: thin;
}
.controls-bar > * { flex-shrink: 0; }
.toolbar-search { width: clamp(170px, 13vw, 240px); flex: 0 1 240px; min-width: 170px; }
.toolbar-search input, .toolbar-sort { width: 100%; }
.toolbar-sort-wrap { width: 150px; }
.toolbar-field {
    background: #160d24;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-main);
    padding: 7px 10px;
    height: 36px;
    min-height: 36px;
    font-size: 13px;
    font-family: inherit;
}
.toolbar-field:focus { outline: 1px solid var(--accent-pink); }
.toolbar-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.toolbar-group .filter-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 36px;
    min-height: 36px;
    padding: 6px 9px;
    font-size: 12px;
}
.toolbar-group .filter-btn[aria-pressed="true"] {
    background: var(--accent-pink);
    border-color: var(--accent-pink);
    color: #fff;
}
.toolbar-platforms .filter-btn[aria-pressed="true"] { background: rgba(255,71,155,.2); color: var(--text-main); }
.toolbar-platforms .filter-btn[data-platform="all"][aria-pressed="true"] { background: rgba(255,71,155,.2); }
.toolbar-platforms .platform-icon { width: 15px; height: 15px; margin: 0; flex-shrink: 0; }
.toolbar-platforms .platform-label { white-space: nowrap; }
.toolbar-month select { max-width: 112px; }
.toolbar-month .year-select { width: 76px; }
.toolbar-month .filter-btn { min-width: 30px; padding: 5px 7px; font-size: 18px; }
.toolbar-custom { position: relative; flex-shrink: 0; }
.toolbar-custom > .filter-btn { height: 36px; font-size: 12px; }
.toolbar-custom > .filter-btn[aria-expanded="true"] { border-color: var(--accent-pink); }
.date-panel {
    position: absolute;
    top: calc(100% + 7px);
    right: 0;
    z-index: 50;
    width: min(350px, calc(100vw - 32px));
    background: #21152b;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
}
.date-panel label { display: block; color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
.date-panel .toolbar-field { display: block; width: 100%; margin-top: 4px; color-scheme: dark; }
.date-panel-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.date-panel-actions .filter-btn { padding: 7px 12px; }
.filter-note { color: var(--text-muted); font-size: 12px; margin-top: 7px; }
.filter-note[hidden], .date-panel[hidden] { display: none !important; }
.main-container { padding: 0 20px 30px; }
.content-wrapper { grid-template-columns: minmax(0,1fr) 290px; gap: 18px; align-items: start; }
.content-wrapper > * { min-width: 0; }
.results-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 9px; font-size:12px; color:var(--text-muted); }
.results-bar strong { color: var(--text-main); }
.month-stat { width: 100%; color: var(--text-main); cursor: pointer; text-align: left; font: inherit; }

.monthly-note { font-size:11px; color:var(--text-muted); margin-bottom:10px; }
.favorite-remove { border:0; background:transparent; padding:4px; font-size:17px; }
.empty-state { padding:35px 12px; }
.empty-state p { margin-top:5px; }
.platform-tag { text-decoration:none; }
.platform-tag:hover { border-color:var(--accent-purple); }
.game-card .card-actions { opacity:1; visibility:visible; }
.game-card.grid-hover-card .card-actions { opacity:1; visibility:visible; }
.game-card.grid-hover-card:focus-within .grid-overlay-info { transform:translateY(0); }
.game-card.grid-hover-card:focus-within { outline:1px solid var(--accent-pink); }
.game-cover img { display:block; }
@media (hover:hover) and (pointer:fine) {
    .game-card.grid-hover-card:not(:hover):not(:focus-within) .grid-overlay-info { transform:translateY(100%); }
}
@media (max-width: 1350px) {
    .toolbar-search { width:180px; min-width:160px; }
    .toolbar-platforms .platform-label { display:none; }
    .toolbar-platforms .filter-btn { min-width:36px; }
}
@media (max-width: 1024px) {
    .header-top { flex-wrap:wrap; }
    .stats { order:3; width:100%; margin-left:0; justify-content:flex-start; }
    .controls-bar { flex-wrap:wrap; overflow:visible; }
    .toolbar-search { flex:1 1 230px; width:auto; max-width:none; }
    .toolbar-sort-wrap { flex:0 0 165px; }
    .toolbar-platforms .platform-label { display:inline; }
    .content-wrapper { grid-template-columns:1fr; }
}
@media (max-width: 768px) {
    .header { padding:10px 12px; }
    .header-top { flex-direction:row; align-items:center; }
    .header-actions { width:auto; }
    .stats { gap:15px; }
    .controls { margin:0 10px 10px; padding:10px; }
    .toolbar-search { flex:1 1 100%; }
    .toolbar-sort-wrap { flex:1 1 100%; width:auto; }
    .toolbar-platforms { flex-wrap:wrap; }
    .toolbar-presets { flex-wrap:wrap; }
    .main-container { padding:0 10px 24px; }
    .games-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; }
    .games-grid.compact { grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
    .game-card.grid-hover-card .grid-overlay-info { position:static; transform:none; }
    .game-card.grid-hover-card .game-cover { aspect-ratio:3/4; }
}
@media (max-width: 480px) {
    .brand h1 { font-size:1.2rem; }
    .brand img { width:34px; height:34px; }
    .stat { min-width:0; }
    .stat-value { font-size:1.2rem; }
    .stat-label { font-size:9px; }

    .view-mode-btn { padding:5px 7px; }
    .toolbar-month { flex-wrap:wrap; }
    .toolbar-month select { max-width:105px; }
    .date-panel { left:0; right:auto; }
    .games-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .games-grid.compact { grid-template-columns:repeat(2,minmax(0,1fr)); }
}

    <script id="calendar-core">
/* Date-only values from IGDB are UTC calendar days. All comparisons use YYYY-MM-DD. */
const CalendarCore = (() => {
  const pad = n => String(n).padStart(2, '0');
  const localDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const utcDay = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  function validDay(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;const d=new Date(s+'T00:00:00Z');return !isNaN(d)&&utcDay(d)===s; }
  function addDays(day,n){const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return utcDay(d);}
  function monthRange(year,month){
    const start=new Date(0),end=new Date(0);
    start.setUTCFullYear(year,month,1);start.setUTCHours(0,0,0,0);
    end.setUTCFullYear(year,month+1,0);end.setUTCHours(0,0,0,0);
    return {from:utcDay(start),to:utcDay(end)};
  }
  function periodRange(kind,today,coverage){const d=new Date(today+'T00:00:00Z'),y=d.getUTCFullYear(),m=d.getUTCMonth();if(kind==='month')return monthRange(y,m);if(kind==='next')return monthRange(y,m+1);if(kind==='year')return {from:`${y}-01-01`,to:`${y}-12-31`};if(kind==='all')return coverage&&coverage.from?{...coverage}:monthRange(y,m);const n=Number(kind);if([7,30,90].includes(n))return {from:today,to:addDays(today,n-1)};return monthRange(y,m);}
  function dateFromValue(value){let ms;if(typeof value==='number')ms=value>1e12?value:value*1000;else if(typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value))ms=Date.parse(value+'T00:00:00Z');else if(typeof value==='string'&&/^\d+(?:\.\d+)?$/.test(value)){const n=Number(value);ms=n>1e12?n:n*1000;}else ms=Date.parse(value);if(!Number.isFinite(ms))return null;const d=new Date(ms);return isNaN(d)?null:{day:utcDay(d),timestamp:Math.floor(ms/1000)};}
  function platformName(p){if(typeof p==='string')return p;if(typeof p==='number')return String(p);return p?.name||String(p?.id||'');}
  function platformClass(name){
    const n=String(name).toLowerCase();
    if(['6','pc','windows','3','14'].includes(n)||n.includes('windows')||n.includes('steam')||n.includes('mac'))return 'PC';
    if(['130','5','20','37','41','137','159'].includes(n)||n.includes('nintendo')||n.includes('switch')||n.includes('wii')||n.includes('game boy')||n.includes('gamecube'))return 'Nintendo';
    if(['7','8','9','38','46','48','165','167'].includes(n)||n.includes('playstation')||/^ps[1-5]$/.test(n))return 'PlayStation';
    if(['11','12','49','169'].includes(n)||n.includes('xbox'))return 'Xbox';
    return 'Other';
  }
  function normalizeReleases(raw){const map=new Map();for(const item of raw){const info=dateFromValue(item.date??item.first_release_date);const game=item.game||item;const name=game?.name;if(!info||!name)continue;const gameId=game.id??item.game_id??name.toLowerCase();const key=String(gameId)+'|'+info.day;const ps=item.platforms??game.platforms??(item.platform?[item.platform]:[]);const platforms=(Array.isArray(ps)?ps:[ps]).map(platformName).filter(Boolean);const cover=game.cover?.url??(typeof game.cover==='string'?game.cover:'');if(!map.has(key))map.set(key,{id:item.id??key,gameId,name,day:info.day,date:info.timestamp,cover,platforms:[],gameType:game.game_type??0});const result=map.get(key);if(!result.cover&&cover)result.cover=cover;for(const p of platforms)if(!result.platforms.includes(p))result.platforms.push(p);}return [...map.values()].sort((a,b)=>a.day.localeCompare(b.day)||a.name.localeCompare(b.name));}
  function filterGames(games,filters,ignoreRange=false){const search=(filters.search||'').toLocaleLowerCase().trim();const selected=filters.platforms;return games.filter(g=>(!search||g.name.toLocaleLowerCase().includes(search))&&(ignoreRange||(!filters.from||g.day>=filters.from)&&(!filters.to||g.day<=filters.to))&&(!selected||g.platforms.some(p=>selected.includes(platformClass(p)))));}
  function monthCounts(games,range){const counts=new Map();for(const g of games){const key=g.day.slice(0,7);counts.set(key,(counts.get(key)||0)+1);}if(!range?.from||!range?.to)return [...counts].sort().map(([key,count])=>({key,count}));const result=[];let y=Number(range.from.slice(0,4)),m=Number(range.from.slice(5,7))-1;const end=range.to.slice(0,7);while(`${String(y).padStart(4,'0')}-${pad(m+1)}`<=end){const key=`${String(y).padStart(4,'0')}-${pad(m+1)}`;result.push({key,count:counts.get(key)||0});m++;if(m===12){m=0;y++;}}return result;}
  function summaries(games,filters,today){const visible=filterGames(games,filters);const base=filterGames(games,filters,true);const next30={from:today,to:addDays(today,29)};const d=new Date(today+'T00:00:00Z');const next=monthRange(d.getUTCFullYear(),d.getUTCMonth()+1);const count=r=>base.filter(g=>g.day>=r.from&&g.day<=r.to).length;return {total:visible.length,in30:count(next30),nextMonth:count(next),months:monthCounts(visible,{from:filters.from,to:filters.to})};}
  function coverage(games){if(!games.length)return null;let from=games[0].day,to=from;for(const g of games){if(g.day<from)from=g.day;if(g.day>to)to=g.day;}return {from,to};}
  return {localDay,utcDay,validDay,addDays,monthRange,periodRange,dateFromValue,platformName,platformClass,normalizeReleases,filterGames,monthCounts,summaries,coverage};
})();
window.CalendarCore=CalendarCore;
    </script>

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));

            if (!C.validDay(day)) return day;
            const [year, month, date] = day.split('-');
            return currentLang === 'cs'

        // Stejný export pro jednu hru i pro celý aktuální výběr.
        function escapeIcs(value) {
            return String(value ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n')
                .replace(/;/g, '\\;').replace(/,/g, '\\,');
        }

        function foldIcs(line) {
            let result = '', part = '', bytes = 0;
            for (const char of line) {
                const size = new TextEncoder().encode(char).length;
                if (bytes + size > 75) {
                    result += part + '\r\n ';
                    part = '';
                    bytes = 1;
                }
                part += char;
                bytes += size;
            }
            return result + part;
        }

        function buildIcs(games) {
            const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
            const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GameS Calendar//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
            for (const game of games) {
                const day = game.day;
                if (!C.validDay(day)) continue;
                const start = day.replace(/-/g, '');
                const end = C.addDays(day, 1).replace(/-/g, '');
                const id = String(game.id ?? game.gameId ?? game.name).replace(/[^a-zA-Z0-9_-]/g, '_');
                lines.push('BEGIN:VEVENT',
                    `UID:game-${id}-${start}@games-calendar`,
                    `DTSTAMP:${stamp}`,
                    `DTSTART;VALUE=DATE:${start}`,
                    `DTEND;VALUE=DATE:${end}`,
                    `SUMMARY:${escapeIcs(game.name)}`,
                    `DESCRIPTION:${escapeIcs((game.platforms || []).join(', '))}`,
                    'END:VEVENT');
            }
            lines.push('END:VCALENDAR');
            return lines.map(foldIcs).join('\r\n') + '\r\n';
        }

        function saveIcs(games, filename) {
            if (!games.length) {
                alert(translations[currentLang].downloadEmpty);
                return;
            }
            const blob = new Blob([buildIcs(games)], {type:'text/calendar;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function getGameById(id) {
            return normalizedGames.find(game => String(game.id) === String(id));
        }

        function safeHttpUrl(value) {
            if (!value) return '';
            try {
                const url = new URL(String(value).startsWith('//') ? 'https:' + value : value, location.href);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
            } catch {
                return '';
            }
        }

            const presets = [

            ).join('');

            const coverage = getDataCoverage();

            const min = Math.max(1, Math.min(year - 1, nowYear - 1, Number(coverage?.from.slice(0, 4) || year) - 1));
            const max = Math.min(9999, Math.max(year + 1, nowYear + 2, Number(coverage?.to.slice(0, 4) || year) + 1));
            el('year-select').innerHTML = Array.from({length: max - min + 1}, (_, i) =>
                `<option value="${min + i}" ${min + i === year ? 'selected' : ''}>${min + i}</option>`
            ).join('');

            </div>
        `;
    }).join('');

    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <div class="empty-state-icon">🔍</div>
            <h3>${escapeHtml(t.noGames)}</h3>
            <p>${escapeHtml(t.noGamesHint)}</p>
        </div>`;
    }

    updateResultsInfo(filtered.length);
    updateStats();
    updateMonthStats();
}


        function downloadAllIcs() {
            const games = getFilteredGames();
            saveIcs(games, `game-calendar-${currentFilters.dateFrom}-${currentFilters.dateTo}.ics`);
        }


        function downloadIcs(gameName, platformName, timestamp) {
            const info = C.dateFromValue(timestamp);
            if (!info) return;
            saveIcs([{
                id: `${gameName}-${info.day}`,
                name: gameName,
                day: info.day,
                platforms: platformName ? [platformName] : []
            }], `${gameName.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'game'}.ics`);
        }


        function showCalendarMenu(event, gameName, dateICS, dateStr, platformName, timestamp) {
            event?.stopPropagation();
            document.getElementById('calendar-menu')?.remove();
            const info = C.dateFromValue(timestamp);
            if (!info) return;
            const day = info.day;
            const start = day.replace(/-/g, '');
            const endDay = C.addDays(day, 1);
            const end = endDay.replace(/-/g, '');

            const menu = document.createElement('div');
            menu.id = 'calendar-menu';
            menu.style.cssText = 'position:fixed;background:#160d24;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:1000;min-width:155px;display:flex;flex-direction:column;gap:3px';
            const linkStyle = 'display:block;padding:8px 10px;color:var(--text-main);font-size:13px;text-decoration:none;background:transparent;border:0;text-align:left;border-radius:4px;font-family:inherit;cursor:pointer';

            const google = document.createElement('a');
            google.textContent = 'Google Calendar';
            google.href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(gameName)}&dates=${start}/${end}`;
            google.target = '_blank';
            google.rel = 'noopener noreferrer';
            google.style.cssText = linkStyle;

            const outlook = document.createElement('a');
            outlook.textContent = 'Outlook';
            outlook.href = `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(gameName)}&startdt=${day}&enddt=${endDay}&allday=true`;
            outlook.target = '_blank';
            outlook.rel = 'noopener noreferrer';
            outlook.style.cssText = linkStyle;

            const apple = document.createElement('button');
            apple.type = 'button';
            apple.textContent = 'Apple / .ics';
            apple.style.cssText = linkStyle;
            apple.addEventListener('click', () => {
                downloadIcs(gameName, platformName, timestamp);
                close();
            });
            menu.append(google, outlook, apple);
            document.body.appendChild(menu);

            const rect = menu.getBoundingClientRect();
            menu.style.left = Math.max(8, Math.min(event?.clientX ?? 8, window.innerWidth - rect.width - 8)) + 'px';
            menu.style.top = Math.max(8, Math.min(event?.clientY ?? 8, window.innerHeight - rect.height - 8)) + 'px';

            const controller = new AbortController();
            function close() {
                menu.remove();
                controller.abort();
            }
            document.addEventListener('pointerdown', e => {
                if (!menu.contains(e.target)) close();
            }, {signal: controller.signal});
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') close();
            }, {signal: controller.signal});
            menu.addEventListener('click', e => {
                if (e.target.closest('a')) close();
            });
            google.focus();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            document.querySelectorAll('.view-mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${mode}'`));
            });
            renderGames();
        }


        function toggleFavorite(gameId, gameName, event) {
            event?.stopPropagation();
            const idx = favorites.findIndex(f => String(f.id) === String(gameId));
            if (idx !== -1) {
                favorites.splice(idx, 1);
            } else {
                const game = getGameById(gameId);
                if (!game && !gameName) return;
                favorites.push({id: game?.id ?? gameId, name: game?.name ?? gameName});
            }
            try { localStorage.setItem('favorites', JSON.stringify(favorites)); } catch {}
            renderGames();
            updateFavorites();
        }


        function updateFavorites() {
            const list = document.getElementById('favorites-list');
            if (!favorites.length) {
                list.innerHTML = `<p style="color:var(--text-muted);font-size:.85rem">${escapeHtml(translations[currentLang].noFavorites)}</p>`;
                return;
            }
            list.innerHTML = favorites.map(f => `
                <div class="favorite-item">
                    <span>${escapeHtml(f.name)}</span>
                    <button class="favorite-remove" type="button" data-remove-favorite="${escapeHtml(f.id)}"
                        title="${escapeHtml(translations[currentLang].removeFavorite)}" aria-label="${escapeHtml(translations[currentLang].removeFavorite)}">✕</button>
                </div>
            `).join('');
        }


        function removeFavorite(gameId) {
            favorites = favorites.filter(f => String(f.id) !== String(gameId));
            try { localStorage.setItem('favorites', JSON.stringify(favorites)); } catch {}
            renderGames();
            updateFavorites();
        }


        function updateStats() {
            const summary = getSummary();
            const locale = currentLang === 'cs' ? 'cs-CZ' : 'en-US';
            document.getElementById('stat-total').textContent = summary.total.toLocaleString(locale);
            document.getElementById('stat-30days').textContent = summary.in30.toLocaleString(locale);
            document.getElementById('stat-upcoming').textContent = summary.nextMonth.toLocaleString(locale);
        }


        function updateMonthStats() {
            const summary = getSummary();
            const locale = currentLang === 'cs' ? 'cs-CZ' : 'en-US';
            const container = document.getElementById('month-stats');
            container.innerHTML = summary.months.map(({key, count}) => {
                const [year, month] = key.split('-').map(Number);
                const monthName = translations[currentLang].months[month - 1];
                const active = activePeriod === 'month' && currentFilters.dateFrom === key + '-01';
                return `<button type="button" class="month-stat ${active ? 'active' : ''}" data-month="${key}">
                    <span class="month-stat-name">${escapeHtml(monthName)} ${year}</span>
                    <span class="month-stat-count">${count.toLocaleString(locale)}</span>
                </button>`;
            }).join('');
            document.getElementById('month-total').textContent = summary.total.toLocaleString(locale);
        }


        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            updateTexts();
        }

        async function showCalendarShareLink() {
            const q = new URLSearchParams({
                platforms: currentFilters.platforms.join(','),
                dateFrom: currentFilters.dateFrom,
                dateTo: currentFilters.dateTo
            });
            if (currentFilters.search) q.set('search', currentFilters.search);
            if (currentViewMode !== 'grid') q.set('view', currentViewMode);
            if (el('sort').value !== 'date-asc') q.set('sort', el('sort').value);
            const url = location.href.split('?')[0].split('#')[0] + '?' + q.toString();
            try {
                await navigator.clipboard.writeText(url);
                alert(translations[currentLang].shareCopied);
            } catch {
                prompt(translations[currentLang].shareFallback, url);
            }
        }


        function updateTexts() {
            document.documentElement.lang = currentLang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const value = translations[currentLang][el.dataset.i18n];
                if (typeof value === 'string') el.textContent = value;
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const value = translations[currentLang][el.dataset.i18nPlaceholder];
                if (typeof value === 'string') el.placeholder = value;
            });
            document.querySelectorAll('.view-mode-btn').forEach(btn => {
                const mode = btn.getAttribute('onclick').match(/'(grid|compact|list)'/)?.[1];
                btn.classList.toggle('active', mode === currentViewMode);
            });
            renderDateFilterButtons();
            renderPlatformControls();
            if (dataLoaded) renderGames();
            updateFavorites();
        }


        // Event Listeners
        el('search').addEventListener('input', event => {
            currentFilters.search = event.target.value;
            renderGames();
        });
        el('sort').addEventListener('change', renderGames);

        el('period-presets').addEventListener('click', event => {
            const button = event.target.closest('[data-period]');
            if (button) setPeriod(button.dataset.period);
        });
        el('prev-month').addEventListener('click', () => changeMonth(-1));
        el('next-month').addEventListener('click', () => changeMonth(1));
        el('month-select').addEventListener('change', () => selectMonth(el('year-select').value, el('month-select').value));
        el('year-select').addEventListener('change', () => selectMonth(el('year-select').value, el('month-select').value));

        el('custom-toggle').addEventListener('click', () => {
            if (el('custom-panel').hidden) openCustomPanel();
            else closeCustomPanel();
        });
        el('custom-cancel').addEventListener('click', closeCustomPanel);
        el('custom-panel').addEventListener('submit', event => {
            event.preventDefault();
            applyCustomDate();
        });
        document.addEventListener('pointerdown', event => {
            if (!el('custom-panel').hidden &&
                !el('custom-panel').contains(event.target) &&
                !el('custom-control').contains(event.target)) closeCustomPanel();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeCustomPanel();
        });

        el('platform-filters').addEventListener('click', event => {
            const button = event.target.closest('[data-platform]');
            if (button) togglePlatform(button.dataset.platform);
        });
        el('games-grid').addEventListener('click', event => {
            const favorite = event.target.closest('[data-favorite]');
            if (favorite) {
                const game = getGameById(favorite.dataset.favorite);
                if (game) toggleFavorite(game.id, game.name, event);
                return;
            }
            const calendar = event.target.closest('[data-calendar]');
            if (calendar) {
                const game = getGameById(calendar.dataset.calendar);
                if (game) showCalendarMenu(event, game.name, game.day.replace(/-/g, ''), game.day, game.platforms[0] || 'Multi', game.date);
            }
        });
        el('favorites-list').addEventListener('click', event => {
            const button = event.target.closest('[data-remove-favorite]');
            if (button) removeFavorite(button.dataset.removeFavorite);
        });
        el('month-stats').addEventListener('click', event => {
            const button = event.target.closest('[data-month]');
            if (!button) return;
            const [year, month] = button.dataset.month.split('-').map(Number);
            selectMonth(year, month - 1);
            window.scrollTo({top:0, behavior:'smooth'});
        });

        // Init
        init();
    </script>
</body>
</html>
